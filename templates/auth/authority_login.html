{% extends 'base.html' %}
{% block title %}Authority Login - FindIT{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 2rem auto;">
    <div class="card" style="border-top: 5px solid #161730; box-shadow: 0 10px 30px rgba(22, 23, 48, 0.15); border-radius: 1rem; padding: 2rem;">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="FindIT Logo" style="max-height: 150px; width: auto; margin-bottom: 0.5rem;">
            <h2 class="card-title" style="font-size: 1.6rem; color: #161730; margin-bottom: 0.2rem;">🏛️ College Authority Portal Login</h2>
            <p class="page-subtitle" style="font-size: 0.9rem;">Official Case Investigation & Match Decision Authorization</p>
        </div>

        <form method="POST" action="{{ url_for('auth.authority_login') }}">
            <div class="form-group">
                <label class="form-label" for="email">Authority Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="authority@college.edu" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Authority Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter authority password" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.85rem; font-size: 1rem; background: #161730; font-weight: 700;">
                Login to Authority Dashboard
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
            Student or Finder user? <a href="{{ url_for('auth.login') }}" style="color: #8063F5; font-weight: 700;">User Login</a>
        </div>
    </div>
</div>
{% endblock %}
