{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div style="max-width: 500px; margin: 2rem auto;">
    <div class="card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="FindIT Logo" style="max-height: 160px; width: auto; margin-bottom: 0.5rem; filter: drop-shadow(0 4px 8px rgba(112, 18, 43, 0.2));">
            <h2 class="card-title" style="font-size: 1.6rem; color: var(--primary);">Create FindIT Account</h2>
            <p class="page-subtitle">Register with your campus identity</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="form-group">
                <label class="form-label" for="name">Full Name</label>
                <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Alex Johnson" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Campus Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="student@college.edu" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="mobile_number">Mobile Number</label>
                <input type="tel" id="mobile_number" name="mobile_number" class="form-control" placeholder="e.g. 9876543210" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="role">Role</label>
                <select id="role" name="role" class="form-control" required>
                    <option value="STUDENT" selected>Student</option>
                    <option value="STAFF">Faculty / Staff</option>
                    <option value="ADMIN">College Authority (Admin)</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Register Account</button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
            Already have an account? <a href="{{ url_for('auth.login') }}" style="color: var(--accent); font-weight: 600;">Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
